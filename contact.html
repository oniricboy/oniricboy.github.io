<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oniricboy – Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/header.css">
  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background-color: #fff;
      color: #000;
    }

    .contact-section {
      max-width: 600px;
      margin: 4rem auto;
      padding: 0 2rem;
    }

    .contact-section h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    .contact-section form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .contact-section label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .contact-section input,
    .contact-section textarea {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    .contact-section button {
      background: #000;
      color: #fff;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-section button:hover {
      background: #333;
    }

    .contact-links {
      text-align: center;
      margin-top: 2rem;
    }

    .contact-links a {
      margin: 0 1rem;
      font-size: 1.4rem;
      color: #000;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .contact-links a:hover {
      opacity: 0.6;
    }

    @media screen and (max-width: 768px) {
       .contact-section {
    padding: 0 1.5rem;
    text-align: center;
  }

  .contact-section form {
    align-items: stretch;
  }

  .contact-section input,
  .contact-section textarea {
    width: 100%;
  }

  .contact-links {
    margin-top: 1.5rem;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
  }
}
  </style>
</head>
<body>
  
  <header class="site-header" id="site-header">
  <div class="logo">
    <a href="/index.html"><img src="/img/logo.png" alt="oniricboy logo"></a>
  </div>

  <nav class="main-nav" id="main-nav" aria-label="Main">
    <ul class="nav-list">
      <li><a href="/">Home</a></li>
      <li class="has-dropdown">
        <button class="dropdown-toggle" type="button" aria-expanded="false" aria-controls="dd-work">
          Work <i class="fa-solid fa-chevron-down caret" aria-hidden="true"></i>
        </button>
        <ul class="dropdown" id="dd-work">
          <li><a href="/work/2023-2024/">2023–2024</a></li>
          <li><a href="/work/2019-2021/">2019–2021</a></li>
          <li><a href="/work/2017-2018/">2017–2018</a></li>
          <li><a href="/work/2015-2016/">2015–2016</a></li>
        </ul>
      </li>
      <li class="has-dropdown">
        <button class="dropdown-toggle" type="button" aria-expanded="false" aria-controls="dd-project">
          Project <i class="fa-solid fa-chevron-down caret" aria-hidden="true"></i>
        </button>
        <ul class="dropdown" id="dd-project">
          <li><a href="/project/inside/">The Inside and the Boy</a></li>
        </ul>
      </li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/shop.html">Shop</a></li>
    </ul>
  </nav>

  <div class="socials">
    <a href="https://instagram.com/oniricboy_" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://x.com/oniricboy_" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
  </div>

  <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
    <span></span><span></span><span></span>
  </button>
</header>

  <section id="contact" class="contact-section">
    <h2>contact</h2>
    <form action="https://formsubmit.co/oniricboycontact@gmail.com" method="POST">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <input type="hidden" name="_next" value="https://oniricboy.com/thanks.html">

      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send</button>
    </form>

    <div class="contact-links">
      <a href="https://instagram.com/oniricboy_" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/oniricboy_" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
  </section>
<script src="/js/header.js"></script>
</body>
</html>
