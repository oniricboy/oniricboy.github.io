<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oniricboy – Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background-color: #fff;
      color: #000;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #eee;
    }
    .logo img {
      height: 60px;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
      position: relative;
    }
    nav li {
      position: relative;
    }
    nav a {
      text-decoration: none;
      color: #000;
      font-weight: 600;
      font-size: 0.9rem;
    }
    nav ul li:hover .dropdown {
      display: block;
    }
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid #ddd;
      padding: 0.5rem 0;
      z-index: 10;
    }
    .dropdown li {
      padding: 0;
    }
    .dropdown a {
      display: block;
      padding: 0.5rem 1rem;
      white-space: nowrap;
    }
    .dropdown a:hover {
      background-color: #f3f3f3;
    }
    .socials a {
      color: #000;
      font-size: 1.1rem;
      margin-left: 1.2rem;
      transition: opacity 0.3s ease;
    }
    .socials a:hover {
      opacity: 0.6;
    }

    /* ---------- CARRUSEL ---------- */
    .carousel-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      background: #fff;
      padding: 2rem 0 1rem;
      z-index: 1;
      outline: none;
    }
    .carousel-track {
      display: flex;
      align-items: center;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
      touch-action: pan-y;
      user-select: none;
    }
    .carousel-slide {
      flex: 0 0 33.333vw;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow: hidden;
      opacity: 0.35;
      transform: scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .carousel-slide.is-active {
      opacity: 1;
      transform: scale(1);
    }
    .carousel-slide img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    /* Desactiva animaciones durante el salto invisible del bucle */
    .carousel-track.no-anim,
    .carousel-track.no-anim .carousel-slide {
      transition: none !important;
    }

    .carousel-btn {
      position: absolute;
      top: calc(50% - 0.5rem);
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #e5e5e5;
      background: rgba(255, 255, 255, 0.92);
      color: #000;
      font-size: 1.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .carousel-btn:hover {
      background: #000;
      color: #fff;
    }
    .carousel-btn:focus-visible {
      outline: 2px solid #000;
      outline-offset: 3px;
    }
    .carousel-btn.prev { left: 1.5rem; }
    .carousel-btn.next { right: 1.5rem; }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }
    .carousel-dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: #ccc;
      cursor: pointer;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .carousel-dots button[aria-current="true"] {
      width: 24px;
      background: #000;
    }

    @media (prefers-reduced-motion: reduce) {
      .carousel-track,
      .carousel-slide {
        transition: none !important;
      }
    }

    @media screen and (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      nav ul {
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.6rem;
      }
      .socials {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .carousel-container {
        padding-top: 0;
      }
      .carousel-slide {
        flex-basis: 100%;
        height: auto;
        padding: 0;
      }
      .carousel-slide img {
        height: auto;
        max-height: 55vh;
        width: auto;
        max-width: 100%;
      }
      .carousel-btn {
        width: 38px;
        height: 38px;
        font-size: 1.3rem;
      }
      .carousel-btn.prev { left: 0.6rem; }
      .carousel-btn.next { right: 0.6rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="/index.html"><img src="/img/logo.png" alt="oniricboy logo"></a>
  </div>
<nav>
  <ul>
    <li><a href="/">Home</a></li>
    <li>
      <a href="#">Work ▾</a>
      <ul class="dropdown">
        <li><a href="/work/2023-2024/">2023–2024</a></li>
        <li><a href="/work/2019-2021/">2019–2021</a></li>
        <li><a href="/work/2017-2018/">2017–2018</a></li>
        <li><a href="/work/2015-2016/">2015–2016</a></li>
      </ul>
    </li>
    <li>
      <a href="#">Project ▾</a>
      <ul class="dropdown">
        <li><a href="/project/inside/">The Inside and the Boy</a></li>
      </ul>
    </li>
    <li><a href="/about.html">About</a></li>
    <li><a href="/contact.html">Contact</a></li>

  </ul>
</nav>
  <div class="socials">
    <a href="https://instagram.com/oniricboy_" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://x.com/oniricboy_" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
  </div>
</header>

<section class="carousel-container" id="carousel-container" tabindex="0"
         aria-roledescription="carousel" aria-label="Selected work">
  <div class="carousel-track" id="carousel">
    <div class="carousel-slide"><img src="/work/2019-2021/art_01.png" alt="Art 1" draggable="false"></div>
    <div class="carousel-slide"><img src="/work/2019-2021/art_02.png" alt="Art 2" draggable="false"></div>
    <div class="carousel-slide"><img src="/work/2019-2021/art_03.png" alt="Art 3" draggable="false"></div>
    <div class="carousel-slide"><img src="/work/2019-2021/art_04.png" alt="Art 4" draggable="false"></div>
    <div class="carousel-slide"><img src="/work/2019-2021/art_05.png" alt="Art 5" draggable="false"></div>
  </div>

  <button class="carousel-btn prev" type="button" aria-label="Previous">‹</button>
  <button class="carousel-btn next" type="button" aria-label="Next">›</button>

  <div class="carousel-dots" id="carousel-dots"></div>
</section>

<script>
(() => {
  const container = document.getElementById('carousel-container');
  const track     = document.getElementById('carousel');
  const dotsWrap  = document.getElementById('carousel-dots');
  const AUTOPLAY_MS = 5000;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const originals = Array.from(track.children);
  const N = originals.length;
  if (!N) return;

  // Clones a ambos lados para el bucle infinito
  originals.forEach(el => {
    const c = el.cloneNode(true);
    c.setAttribute('aria-hidden', 'true');
    track.appendChild(c);
  });
  for (let i = N - 1; i >= 0; i--) {
    const c = originals[i].cloneNode(true);
    c.setAttribute('aria-hidden', 'true');
    track.insertBefore(c, track.firstChild);
  }
  const slides = Array.from(track.children);

  // Puntos de navegación
  const dots = originals.map((_, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', `Go to image ${i + 1}`);
    b.addEventListener('click', () => { goTo(i); restartAutoplay(); });
    dotsWrap.appendChild(b);
    return b;
  });

  let index = N;          // posición en la pista completa (empieza en el primer original)
  let busy = false;
  let fallback = null;
  let timer = null;

  const realIndex = () => ((index - N) % N + N) % N;

  function offset() {
    const w = slides[0].offsetWidth;
    return -(index * w) + (container.clientWidth - w) / 2; // centra la imagen activa
  }

  function render(animate = true) {
    track.classList.toggle('no-anim', !animate);
    track.style.transform = `translateX(${offset()}px)`;
    slides.forEach((s, i) => s.classList.toggle('is-active', i === index));
    dots.forEach((d, i) => d.setAttribute('aria-current', i === realIndex() ? 'true' : 'false'));
    if (!animate) {
      void track.offsetWidth;            // fuerza reflow
      track.classList.remove('no-anim');
    }
  }

  function settle() {
    clearTimeout(fallback);
    if (index >= 2 * N) { index -= N; render(false); }
    else if (index < N) { index += N; render(false); }
    busy = false;
  }

  function go(dir) {
    if (busy) return;
    busy = true;
    index += dir;
    render(true);
    fallback = setTimeout(settle, 700); // por si no llega transitionend
  }

  function goTo(i) {
    if (busy) return;
    const target = N + i;
    if (target === index) return;
    busy = true;
    index = target;
    render(true);
    fallback = setTimeout(settle, 700);
  }

  track.addEventListener('transitionend', e => {
    if (e.target === track && e.propertyName === 'transform') settle();
  });

  // Botones
  container.querySelector('.prev').addEventListener('click', () => { go(-1); restartAutoplay(); });
  container.querySelector('.next').addEventListener('click', () => { go(1);  restartAutoplay(); });

  // Teclado
  container.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { go(-1); restartAutoplay(); }
    if (e.key === 'ArrowRight') { go(1);  restartAutoplay(); }
  });

  // Swipe táctil / arrastre con mouse
  let startX = null, startY = null;
  track.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; });
  window.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    startX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      go(dx < 0 ? 1 : -1);
      restartAutoplay();
    }
  });

  // Autoplay: se pausa al pasar el mouse, al enfocar o si la pestaña está oculta
  function startAutoplay() {
    if (reduceMotion || timer) return;
    timer = setInterval(() => go(1), AUTOPLAY_MS);
  }
  function stopAutoplay() { clearInterval(timer); timer = null; }
  function restartAutoplay() { stopAutoplay(); startAutoplay(); }

  container.addEventListener('mouseenter', stopAutoplay);
  container.addEventListener('mouseleave', startAutoplay);
  container.addEventListener('focusin', stopAutoplay);
  container.addEventListener('focusout', startAutoplay);
  document.addEventListener('visibilitychange', () => document.hidden ? stopAutoplay() : startAutoplay());

  window.addEventListener('resize', () => render(false));

  render(false);
  startAutoplay();
})();
</script>

</body>
</html>
